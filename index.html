<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vouchwell</title>
<!-- GitHub serves a hostname's root only from a repository named exactly
     <org>.github.io. The site itself lives in the <org>/<org> repository, so
     this page does nothing but send the bare hostname there. The path comes
     from the hostname, so it keeps working when the organisation is renamed
     (proofwire.github.io -> /proofwire/, vouchwell.github.io -> /vouchwell/). -->
<script>
  (function () {
    var host = location.hostname;
    var org = /\.github\.io$/.test(host) ? host.split('.')[0] : 'vouchwell';
    location.replace('/' + org + '/');
  })();
</script>
<meta name="color-scheme" content="light dark">
<style>
  :root { --ground: #e9ebe5; --ink: #12170f; --verify: #0b6e4f; }
  @media (prefers-color-scheme: dark) { :root { --ground: #0f1310; --ink: #dfe5dc; --verify: #47a882; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font: 17px/1.6 Georgia, "Times New Roman", serif; padding: 24px; }
  a { color: var(--verify); }
</style>
</head>
<body>
<!-- Without JavaScript: the repository, whose address GitHub keeps redirecting after the rename. -->
<p>Taking you to <a href="https://github.com/proofwire/proofwire">Vouchwell</a>&hellip;</p>
</body>
</html>
